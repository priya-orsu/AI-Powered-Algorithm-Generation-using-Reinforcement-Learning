version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: algogen_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build: .
    container_name: algogen_backend
    ports:
      - "8000:8000"
    environment:
      - MONGO_URI=mongodb://mongodb:27017/algogen_db
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    depends_on:
      - mongodb

volumes:
  mongo_data:
